<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSphere5</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;color:#fff;overflow-x:hidden;position:relative;background:#0a1020}
#bg{position:fixed;inset:0;z-index:-1;background:url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072') center/cover no-repeat}
#bg::after{content:'';position:absolute;inset:0;background:rgba(5,10,30,0.65)}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.top-logo-wrap{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid #ffcc00;cursor:pointer;background:#000;display:flex;align-items:center;justify-content:center}
.top-logo-wrap img{width:100%;height:100%;object-fit:cover}
.menus{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;flex:1}
.menu-circle{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;line-height:1.2;color:#000;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.2)}
.menu-circle:nth-child(1){background:#ffb627}
.menu-circle:nth-child(2){background:#2b8cff}
.menu-circle:nth-child(3){background:#2ecc71}
.menu-circle:nth-child(4){background:#ff7a3d}
.menu-circle:nth-child(5){background:#0f1f3d;color:#fff;border-color:#ffcc00}
.menu-circle:nth-child(6){background:#e93a8d;color:#fff}
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:20px 15px 90px}
.welcome{font-size:28px;font-weight:700;margin:18px 0 22px;text-shadow:0 2px 10px rgba(0,0,0,.6);text-align:center}
.card{background:#fff;color:#111;width:100%;max-width:560px;border-radius:22px;padding:26px 24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.card-logo{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;border:3px solid #ffcc00;background:#000}
.track-label{font-weight:700;font-size:16px;margin-bottom:14px;color:#222}
.search-box{display:flex;align-items:center;background:#f1f3f5;border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid #e5e7eb}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:15px;font-weight:600}
.btn-search{background:#2b5cff;color:#fff;border:none;width:42%;max-width:200px;padding:11px;border-radius:22px;font-weight:700;cursor:pointer}
.results{margin-top:18px;text-align:left;display:none}
.results.show{display:block}
.r-code{text-align:center;font-weight:800;font-size:18px;margin-bottom:12px;letter-spacing:1px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.lab{color:#666;font-weight:600}.val{font-weight:700;color:#111}
.notfound{display:none;color:#e11d48;font-weight:700;margin-top:14px}
.footer{position:fixed;bottom:0;left:0;right:0;z-index:2;background:rgba(10,20,50,0.9);backdrop-filter:blur(6px);padding:12px;display:flex;justify-content:center;gap:30px;font-size:13px;font-weight:600}
#adminPanel{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:15px}
#adminPanel.show{display:flex}
.admin-box{background:#fff;color:#111;width:100%;max-width:520px;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}
.admin-box h3{margin-bottom:12px}
.admin-box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin:6px 0 10px}
.admin-box label{font-size:12px;font-weight:700;color:#444}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-save{width:100%;background:#111;color:#fff;padding:12px;border-radius:12px;border:none;font-weight:800;margin-top:10px;cursor:pointer}
.btn-close{background:#eee;color:#111;padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer;margin-top:8px;width:100%}
</style>
</head>
<body>
<div id="bg"></div
